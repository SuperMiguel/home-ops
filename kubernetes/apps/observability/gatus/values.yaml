# Gatus — https://github.com/TwiN/gatus
# Status UI + Prometheus metrics. Push notifications: PrometheusRules → Alertmanager.
#
# SOURCE OF TRUTH: see ../SOURCE-OF-TRUTH.md
#   - UniFi-managed clients/devices → Unpoller (MAC / adoption), NOT ICMP IPs here
#   - Gatus only probes in-cluster services + hosts UniFi does not list
#
# Priority for remaining Gatus groups (homelab-rules):
#   critical: servers, home (mqtt/node-red)
#   warning:  core, observability, storage, media, ai
#   silent:   ai-low
#
# NET_RAW required for any remaining icmp:// from non-root.
controllers:
  gatus:
    # RWO PVC (/data sqlite): RollingUpdate can briefly run two pods on different nodes → second stuck ContainerCreating.
    strategy: Recreate
    pod:
      annotations:
        configmap.reloader.stakater.com/reload: gatus
        secret.reloader.stakater.com/reload: gatus-secret
    containers:
      app:
        image:
          repository: twinproduction/gatus
          tag: v5.36.0
        env:
          TZ: America/New_York
          GATUS_CONFIG_PATH: /config/config.yaml
        envFrom:
          - secretRef:
              name: gatus-secret
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 8080
              initialDelaySeconds: 10
              periodSeconds: 20
              timeoutSeconds: 3
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 8080
              initialDelaySeconds: 5
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            add:
              - NET_RAW
            drop:
              - ALL
        resources:
          requests:
            cpu: 25m
          limits:
            memory: 256Mi
defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
service:
  app:
    ports:
      http:
        port: 8080
serviceMonitor:
  app:
    enabled: true
    labels:
      release: kube-prometheus-stack
    endpoints:
      - port: http
        interval: 30s
        path: /metrics
        scrapeTimeout: 10s
configMaps:
  config:
    data:
      config.yaml: |
        metrics: true
        storage:
          type: sqlite
          path: /data/sqlite.db
        ui:
          title: Status
          header: Veliz
        alerting:
          pushover:
            application-token: "${PUSHOVER_APP_KEY_GATUS}"
            user-key: "${PUSHOVER_USER_KEY}"
            title: "Gatus"
            default-alert:
              failure-threshold: 3
              success-threshold: 2
              send-on-resolved: true
          discord:
            webhook-url: "${DISCORD_WEBHOOK_URL}"
            title: "Gatus"
            default-alert:
              failure-threshold: 3
              success-threshold: 2
              send-on-resolved: true
        # Anchors for DRY endpoints; not a Gatus key — see https://github.com/TwiN/gatus#keeping-your-configuration-small
        # No per-endpoint alerts: severity lives in PrometheusRules by group.
        default-endpoint: &defaults
          interval: 5m
          conditions:
            - "[STATUS] == 200"
        lan-icmp: &lan-icmp
          interval: 5m
          conditions:
            - "[CONNECTED] == true"
        endpoints:
          - name: home
            <<: *defaults
            group: core
            url: http://homepage.default.svc.cluster.local:3000
          - name: argo
            <<: *defaults
            group: core
            url: http://argocd-server.argo-system.svc.cluster.local
          - name: grafana
            <<: *defaults
            group: observability
            url: http://grafana-service.observability.svc.cluster.local:3000/login
          - name: prometheus
            <<: *defaults
            group: observability
            url: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090/-/ready
          - name: alertmanager
            <<: *defaults
            group: observability
            url: http://kube-prometheus-stack-alertmanager.observability.svc.cluster.local:9093/-/ready
          - name: victoria-logs
            <<: *defaults
            group: observability
            url: http://victoria-logs-server.observability.svc.cluster.local:9428/select/vmui/
          - name: longhorn
            <<: *defaults
            group: storage
            url: http://longhorn-frontend.longhorn-system.svc.cluster.local
          - name: minio
            <<: *defaults
            group: storage
            # S3 API live probe (console is separate on :9001).
            url: http://minio.minio.svc.cluster.local:9000/minio/health/live
          - name: authentik
            <<: *defaults
            group: core
            url: http://authentik-server.authentik.svc.cluster.local:80/-/health/live/
          - name: prowlarr
            <<: *defaults
            group: media
            url: http://prowlarr.media.svc.cluster.local
          - name: sonarr
            <<: *defaults
            group: media
            url: http://sonarr.media.svc.cluster.local
          - name: radarr
            <<: *defaults
            group: media
            url: http://radarr.media.svc.cluster.local
          - name: sabnzbd
            <<: *defaults
            group: media
            url: http://sabnzbd.media.svc.cluster.local
          - name: seerr
            <<: *defaults
            group: media
            url: http://seerr.media.svc.cluster.local
          - name: agregarr
            <<: *defaults
            group: media
            url: http://agregarr.media.svc.cluster.local
          - name: autobrr
            <<: *defaults
            group: media
            url: http://autobrr.media.svc.cluster.local
          - name: notifier
            <<: *defaults
            group: media
            url: http://notifier.media.svc.cluster.local
          - name: deduparr
            <<: *defaults
            group: media
            # Deduparr has no HTML UI; `/` is often 404. Health endpoint matches Deployment probes.
            url: http://deduparr.media.svc.cluster.local/health/ready
          - name: bazarr
            <<: *defaults
            group: media
            url: http://bazarr.media.svc.cluster.local
          - name: tautulli
            <<: *defaults
            group: media
            url: http://tautulli.media.svc.cluster.local
          - name: node-red
            <<: *defaults
            group: home
            url: http://node-red.home.svc.cluster.local:1880
          - name: mqtt
            <<: *lan-icmp
            group: home
            # Mosquitto is MQTT/TCP, not HTTP — CONNECTED check, not STATUS==200.
            url: tcp://mosquitto.home.svc.cluster.local:1883
            conditions:
              - "[CONNECTED] == true"
          - name: openclaw
            <<: *defaults
            group: ai-low
            url: http://openclaw.ai.svc.cluster.local:18789/healthz
          - name: grafana-mcp
            <<: *defaults
            group: ai-low
            url: http://grafana-mcp.ai.svc.cluster.local:8000/healthz
          - name: kubernetes-mcp
            <<: *defaults
            group: ai-low
            url: http://kubernetes-mcp.ai.svc.cluster.local:8080/healthz
          - name: ollama-macmini
            <<: *defaults
            group: ai
            url: http://10.0.20.25:11434/api/tags
          # --- Hosts NOT visible (or not reliable) in Unpoller — IP probes OK here ---
          - name: water-softener
            <<: *lan-icmp
            group: iot-util
            url: icmp://192.168.120.118
          - name: hl-k8s-32
            <<: *lan-icmp
            group: servers
            url: icmp://10.0.20.32
          - name: hl-k8s-33
            <<: *lan-icmp
            group: servers
            url: icmp://10.0.20.33
          - name: wikijs
            <<: *lan-icmp
            group: core
            url: icmp://10.0.20.77
          # UniFi-managed LAN/IoT/CCTV/Trusted/NAS/Mac Mini/Ruckus/PVE → unpoller-rules (MAC).
persistence:
  config:
    type: configMap
    identifier: config
    globalMounts:
      - path: /config/config.yaml
        subPath: config.yaml
  data:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 1Gi
    storageClass: longhorn
    globalMounts:
      - path: /data
route:
  app:
    hostnames:
      - gatus.veliz.cc
    parentRefs:
      - name: envoy-internal
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: 8080
