# Authentik domain forward-auth for home UI HTTPRoutes.
# Skips Home Assistant (Companion app / LAN API) and Mosquitto (MQTT).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: home-forward-auth
  namespace: home
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: node-red
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: homebridge-alarm
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: homebridge-downstairs
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: homebridge-upstairs
  extAuth:
    failOpen: false
    recomputeRoute: true
    headersToExtAuth:
      - X-Forwarded-For
      - X-Real-Ip
      - accept
      - cookie
      - authorization
      - proxy-authorization
      - x-forwarded-proto
    http:
      backendRefs:
        - kind: Service
          name: ak-outpost-authentik-embedded-outpost
          namespace: authentik
          port: 9000
      path: /outpost.goauthentik.io/auth/envoy
      headersToBackend:
        - Set-Cookie
        - X-authentik-uid
        - X-authentik-username
        - X-authentik-name
        - X-authentik-email
        - X-authentik-groups
        - X-authentik-entitlements
