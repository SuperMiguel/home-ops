            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "SRE home: nodes first, then status. Failing tables show FAIL (not 0). GitOps ignores Progressing. Golden errors = apiserver 5xx.",
