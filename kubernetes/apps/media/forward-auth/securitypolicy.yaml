# Shared Authentik domain forward-auth for media HTTPRoutes (envoy-internal).
# In-cluster Service traffic (Gatus, *arr sync) is unaffected.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: media-forward-auth
  namespace: media
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: seerr
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: sonarr
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: radarr
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: prowlarr
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: bazarr
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: sabnzbd
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: tautulli
  extAuth:
    failOpen: false
    recomputeRoute: true
    headersToExtAuth:
      - X-Forwarded-For
      - X-Real-Ip
      - accept
      - cookie
      - authorization
      - proxy-authorization
      - x-forwarded-proto
    http:
      backendRefs:
        - kind: Service
          name: ak-outpost-authentik-embedded-outpost
          namespace: authentik
          port: 9000
      path: /outpost.goauthentik.io/auth/envoy
      headersToBackend:
        - Set-Cookie
        - X-authentik-uid
        - X-authentik-username
        - X-authentik-name
        - X-authentik-email
        - X-authentik-groups
        - X-authentik-entitlements
