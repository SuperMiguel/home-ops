# OpenClaw gateway — Discord + Ollama (Mac Mini) + Cursor MCP.
# Secrets: see SECRETS.md (1Password Homelab / openclaw-secrets).
# Docs: Super-Veliz-Network/software/openclaw/README.md
#
# After first sync: primary model is ollama/qwen2.5:14b (Mac Mini 10.0.20.25).
# openclaw.json is always synced from this ConfigMap on pod start.
controllers:
  openclaw:
    strategy: Recreate
    replicas: 1
    pod:
      annotations:
        secret.reloader.stakater.com/reload: openclaw-secrets
        configmap.reloader.stakater.com/reload: openclaw-config
    initContainers:
      seed-config:
        image:
          repository: busybox
          tag: "1.37"
        command:
          - /bin/sh
          - -c
          - |
            set -e
            mkdir -p /home/node/.openclaw/workspace
            # ConfigMap is source of truth for openclaw.json (GitOps).
            cp /config/openclaw.json /home/node/.openclaw/openclaw.json
            cp /config/AGENTS.md /home/node/.openclaw/workspace/AGENTS.md
            chown -R 1000:1000 /home/node/.openclaw
            echo "Synced openclaw.json + AGENTS.md from ConfigMap"
        securityContext:
          # Pod defaults to non-root; chown on the PVC needs root for this one-shot.
          runAsUser: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
    containers:
      app:
        image:
          repository: ghcr.io/openclaw/openclaw
          tag: slim
        command:
          - node
          - /app/dist/index.js
          - gateway
          - run
        env:
          TZ: America/New_York
          HOME: /home/node
          OPENCLAW_CONFIG_DIR: /home/node/.openclaw
          NODE_ENV: production
          NPM_CONFIG_CACHE: /home/node/.npm
          OPENCLAW_GATEWAY_TOKEN:
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: OPENCLAW_GATEWAY_TOKEN
          DISCORD_BOT_TOKEN:
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: DISCORD_BOT_TOKEN
          OLLAMA_API_KEY:
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: OLLAMA_API_KEY
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: &port 18789
              initialDelaySeconds: 60
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 5
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /readyz
                port: *port
              initialDelaySeconds: 20
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 6
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: *port
              # First boot installs @openclaw/discord from npm — allow several minutes.
              failureThreshold: 60
              periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 2Gi
defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
configMaps:
  config:
    data:
      openclaw.json: |
        {
          "gateway": {
            "mode": "local",
            "bind": "lan",
            "port": 18789,
            "auth": {
              "mode": "token"
            },
            "controlUi": {
              "enabled": true,
              "allowedOrigins": [
                "https://openclaw.veliz.cc"
              ]
            }
          },
          "models": {
            "providers": {
              "ollama": {
                "baseUrl": "http://10.0.20.25:11434",
                "apiKey": "ollama-local",
                "api": "ollama",
                "timeoutSeconds": 300,
                "models": [
                  {
                    "id": "qwen2.5:14b",
                    "name": "qwen2.5:14b"
                  }
                ]
              }
            }
          },
          "agents": {
            "defaults": {
              "workspace": "~/.openclaw/workspace",
              "model": {
                "primary": "ollama/qwen2.5:14b"
              }
            },
            "list": [
              {
                "id": "default",
                "name": "OpenClaw Assistant",
                "workspace": "~/.openclaw/workspace"
              }
            ]
          },
          "channels": {
            "discord": {
              "enabled": true,
              "token": {
                "source": "env",
                "provider": "default",
                "id": "DISCORD_BOT_TOKEN"
              },
              "groupPolicy": "allowlist",
              "dmPolicy": "pairing",
              "guilds": {
                "1173832276279296112": {
                  "requireMention": true,
                  "users": [
                    "581220086757720089"
                  ]
                }
              }
            }
          },
          "plugins": {
            "allow": [
              "discord",
              "ollama"
            ],
            "entries": {
              "discord": {
                "enabled": true
              },
              "ollama": {
                "enabled": true
              }
            }
          },
          "mcp": {
            "servers": {
              "grafana": {
                "url": "http://grafana-mcp.ai.svc.cluster.local:8000/mcp",
                "transport": "streamable-http",
                "enabled": true,
                "connectionTimeoutMs": 10000,
                "requestTimeoutMs": 60000
              },
              "kubernetes": {
                "url": "http://kubernetes-mcp.ai.svc.cluster.local:8080/mcp",
                "transport": "streamable-http",
                "enabled": true,
                "connectionTimeoutMs": 10000,
                "requestTimeoutMs": 60000
              }
            }
          },
          "cron": {
            "enabled": false
          }
        }
      AGENTS.md: |
        # OpenClaw Assistant

        You are Miguel's personal assistant for the Veliz home Kubernetes cluster.
        Models run via Ollama on the Mac Mini (10.0.20.25). Prefer concise, actionable replies.

        ## Cluster troubleshooting

        You have MCP tools for **kubernetes** (read-only) and **grafana** (read-only).
        When asked about a down service, Gatus alert, or Grafana dashboard:

        1. Check Kubernetes: pods/deployments/events/logs for the relevant namespace
           (home, media, observability, ai, default, network, argo-system, kube-system).
        2. Check Grafana/Prometheus/Loki via the grafana MCP (search dashboards, query metrics).
        3. Summarize root cause and a concrete fix. Do **not** claim you changed the cluster —
           kubernetes MCP is read-only. Suggest GitOps edits in SuperMiguel/home-ops for fixes/PRs.

        Useful endpoints: grafana.veliz.cc, gatus.veliz.cc, argo.veliz.cc, prometheus.veliz.cc.
        MQTT/Mosquitto lives in namespace `home` (service mosquitto, LB 10.0.20.41:1883).
persistence:
  home:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 10Gi
    storageClass: longhorn
    globalMounts:
      - path: /home/node/.openclaw
  config:
    enabled: true
    type: configMap
    identifier: config
    advancedMounts:
      openclaw:
        seed-config:
          - path: /config
  tmp:
    enabled: true
    type: emptyDir
    medium: Memory
    sizeLimit: 256Mi
    globalMounts:
      - path: /tmp
  # Writable dirs for plugin install under readOnlyRootFilesystem.
  npm:
    enabled: true
    type: emptyDir
    globalMounts:
      - path: /home/node/.npm
  cache:
    enabled: true
    type: emptyDir
    globalMounts:
      - path: /home/node/.cache
  xdg-config:
    enabled: true
    type: emptyDir
    globalMounts:
      - path: /home/node/.config
  local:
    enabled: true
    type: emptyDir
    globalMounts:
      - path: /home/node/.local
service:
  app:
    ports:
      http:
        port: *port
route:
  app:
    hostnames:
      - openclaw.veliz.cc
    parentRefs:
      - name: envoy-internal
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: *port
