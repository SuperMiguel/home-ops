# OpenClaw gateway — Discord + Ollama (Mac Mini) + Cursor MCP.
# Secrets: see SECRETS.md (1Password Homelab / openclaw-secrets).
# Docs: Super-Veliz-Network/software/openclaw/README.md
#
# After first sync: primary model is ollama/qwen3:8b (Mac Mini M4 16GB, 10.0.20.25).
# openclaw.json is always synced from this ConfigMap on pod start.
controllers:
  openclaw:
    strategy: Recreate
    replicas: 1
    pod:
      annotations:
        secret.reloader.stakater.com/reload: openclaw-secrets
        configmap.reloader.stakater.com/reload: openclaw
    initContainers:
      seed-config:
        image:
          repository: busybox
          tag: "1.38"
        command:
          - /bin/sh
          - -c
          - |
            set -e
            mkdir -p /home/node/.openclaw/workspace
            # ConfigMap is source of truth for openclaw.json (GitOps).
            cp /config/openclaw.json /home/node/.openclaw/openclaw.json
            cp /config/AGENTS.md /home/node/.openclaw/workspace/AGENTS.md
            chown -R 1000:1000 /home/node/.openclaw
            echo "Synced openclaw.json + AGENTS.md from ConfigMap"
        securityContext:
          # Pod defaults to non-root; chown on the PVC needs root for this one-shot.
          runAsUser: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
    containers:
      app:
        image:
          repository: ghcr.io/openclaw/openclaw
          tag: slim
        command:
          - node
          - /app/dist/index.js
          - gateway
          - run
        env:
          TZ: America/New_York
          HOME: /home/node
          OPENCLAW_CONFIG_DIR: /home/node/.openclaw
          NODE_ENV: production
          NPM_CONFIG_CACHE: /home/node/.npm
          OPENCLAW_GATEWAY_TOKEN:
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: OPENCLAW_GATEWAY_TOKEN
          DISCORD_BOT_TOKEN:
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: DISCORD_BOT_TOKEN
          OLLAMA_API_KEY:
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: OLLAMA_API_KEY
          HOME_ASSISTANT_TOKEN:
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: HOME_ASSISTANT_TOKEN
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: &port 18789
              initialDelaySeconds: 60
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 5
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /readyz
                port: *port
              initialDelaySeconds: 20
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 6
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: *port
              # First boot installs @openclaw/discord from npm — allow several minutes.
              failureThreshold: 60
              periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 2Gi
defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
configMaps:
  config:
    data:
      openclaw.json: |
        {
          "gateway": {
            "mode": "local",
            "bind": "lan",
            "port": 18789,
            "auth": {
              "mode": "token"
            },
            "controlUi": {
              "enabled": true,
              "allowedOrigins": [
                "https://openclaw.veliz.cc"
              ]
            }
          },
          "models": {
            "providers": {
              "ollama": {
                "baseUrl": "http://10.0.20.25:11434",
                "apiKey": "ollama-local",
                "api": "ollama",
                "timeoutSeconds": 300,
                "contextWindow": 16384,
                "params": {
                  "num_ctx": 16384
                },
                "models": [
                  {
                    "id": "qwen2.5:14b",
                    "name": "qwen2.5:14b",
                    "contextWindow": 16384,
                    "maxTokens": 1024,
                    "params": {
                      "num_ctx": 16384
                    }
                  },
                  {
                    "id": "qwen3:8b",
                    "name": "qwen3:8b",
                    "contextWindow": 16384,
                    "maxTokens": 1024,
                    "params": {
                      "num_ctx": 16384,
                      "think": false
                    }
                  }
                ]
              }
            }
          },
          "tools": {
            "profile": "messaging",
            "deny": [
              "sessions_history",
              "sessions_list",
              "sessions_send"
            ]
          },
          "agents": {
            "defaults": {
              "workspace": "~/.openclaw/workspace",
              "thinkingDefault": "off",
              "skills": [],
              "bootstrapTotalMaxChars": 2500,
              "skipOptionalBootstrapFiles": [
                "HEARTBEAT.md",
                "IDENTITY.md"
              ],
              "compaction": {
                "reserveTokens": 2048,
                "reserveTokensFloor": 0,
                "keepRecentTokens": 3000
              },
              "model": {
                "primary": "ollama/qwen2.5:14b",
                "fallbacks": [
                  "ollama/qwen3:8b"
                ]
              }
            },
            "list": [
              {
                "id": "default",
                "name": "OpenClaw Assistant",
                "workspace": "~/.openclaw/workspace"
              }
            ]
          },
          "channels": {
            "discord": {
              "enabled": true,
              "token": {
                "source": "env",
                "provider": "default",
                "id": "DISCORD_BOT_TOKEN"
              },
              "groupPolicy": "allowlist",
              "dmPolicy": "pairing",
              "guilds": {
                "1173832276279296112": {
                  "requireMention": false,
                  "users": [
                    "581220086757720089"
                  ]
                }
              }
            }
          },
          "plugins": {
            "allow": [
              "discord",
              "ollama"
            ],
            "entries": {
              "discord": {
                "enabled": true
              },
              "ollama": {
                "enabled": true
              }
            }
          },
          "mcp": {
            "servers": {
              "grafana": {
                "url": "http://grafana-mcp.ai.svc.cluster.local:8000/mcp",
                "transport": "streamable-http",
                "enabled": true,
                "connectionTimeoutMs": 10000,
                "requestTimeoutMs": 60000,
                "toolFilter": {
                  "include": [
                    "search_dashboards",
                    "get_dashboard_summary",
                    "list_datasources",
                    "query_prometheus",
                    "check_datasources_health"
                  ]
                }
              },
              "kubernetes": {
                "url": "http://kubernetes-mcp.ai.svc.cluster.local:8080/mcp",
                "transport": "streamable-http",
                "enabled": true,
                "connectionTimeoutMs": 10000,
                "requestTimeoutMs": 60000,
                "toolFilter": {
                  "include": [
                    "pods_list",
                    "pods_list_in_namespace",
                    "pods_get",
                    "pods_log",
                    "events_list",
                    "namespaces_list",
                    "resources_list",
                    "resources_get",
                    "nodes_top"
                  ]
                }
              },
              "homeassistant": {
                "url": "http://home-assistant-app.home.svc.cluster.local:8123/api/mcp",
                "transport": "streamable-http",
                "enabled": true,
                "connectionTimeoutMs": 10000,
                "requestTimeoutMs": 60000,
                "headers": {
                  "Authorization": "Bearer ${HOME_ASSISTANT_TOKEN}"
                },
                "toolFilter": {
                  "include": [
                    "GetLiveContext",
                    "GetDateTime"
                  ]
                }
              }
            }
          },
          "cron": {
            "enabled": false
          }
        }
      AGENTS.md: |
        # OpenClaw Assistant

        You are SuperClaw for Miguel's Veliz home lab. Be concise.

        ## Tool use (critical)

        Never say “I'll check…” or “Let me look into this” without immediately
        issuing a tool call in the same turn. If you need live data, call a tool
        first — text-only promises are a failure.

        Exact tool names (MCP):
        - Home state / lights / climate / sensors: `homeassistant__GetLiveContext`
        - Cluster pods/logs/events: `kubernetes__pods_list_in_namespace`,
          `kubernetes__pods_log`, `kubernetes__events_list`
        - Metrics / Gatus / MQTT health: `grafana__query_prometheus`

        ## Discord

        Answer the user text. Ignore inbound_meta / Conversation Context JSON and
        Discord mention markup (`<@…>`).

        ## Home Assistant

        Call `homeassistant__GetLiveContext`, then summarize. Read-only — do not
        claim you changed devices. Only Assist-exposed entities appear; if missing,
        say so (do not invent entity IDs).

        ## Cluster / Grafana

        k8s + Grafana MCP are read-only. Suggest GitOps fixes in home-ops.
        Prometheus uid `prometheus`. MQTT check:
        `gatus_results_endpoint_success{name="mqtt"}` (1=OK). No mosquitto scrape job.
        No Loki — use k8s pod logs.
persistence:
  home:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 10Gi
    storageClass: longhorn
    globalMounts:
      - path: /home/node/.openclaw
  config:
    enabled: true
    type: configMap
    identifier: config
    advancedMounts:
      openclaw:
        seed-config:
          - path: /config
  tmp:
    enabled: true
    type: emptyDir
    medium: Memory
    sizeLimit: 256Mi
    globalMounts:
      - path: /tmp
  # Writable dirs for plugin install under readOnlyRootFilesystem.
  npm:
    enabled: true
    type: emptyDir
    globalMounts:
      - path: /home/node/.npm
  cache:
    enabled: true
    type: emptyDir
    globalMounts:
      - path: /home/node/.cache
  xdg-config:
    enabled: true
    type: emptyDir
    globalMounts:
      - path: /home/node/.config
  local:
    enabled: true
    type: emptyDir
    globalMounts:
      - path: /home/node/.local
service:
  app:
    ports:
      http:
        port: *port
route:
  app:
    hostnames:
      - openclaw.veliz.cc
    parentRefs:
      - name: envoy-internal
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: *port
