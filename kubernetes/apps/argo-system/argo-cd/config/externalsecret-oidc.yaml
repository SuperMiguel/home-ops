# Merge Authentik OIDC client secret into chart-managed argocd-secret.
# 1Password item: argo-oidc
#   CLIENT_SECRET — from Authentik Provider "Argo CD"
# CLIENT_ID is non-secret and lives in values.yaml oidc.config.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc
  namespace: argo-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: argocd-secret
    creationPolicy: Merge
  data:
    - secretKey: oidc.authentik.clientSecret
      remoteRef:
        key: argo-oidc/CLIENT_SECRET
