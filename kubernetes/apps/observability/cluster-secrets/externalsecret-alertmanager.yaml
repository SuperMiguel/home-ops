# Alertmanager → Pushover + Discord.
# 1Password:
#   homelab-pushover: PUSHOVER_USER_KEY, PUSHOVER_APP_KEY_ALERTMANAGER
#   homelab-discord-alerts: WEBHOOK_URL (Discord channel Integrations → Webhooks)
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager
  namespace: observability
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: alertmanager-secret
    creationPolicy: Owner
  data:
    - secretKey: PUSHOVER_USER_KEY
      remoteRef:
        key: homelab-pushover/PUSHOVER_USER_KEY
    - secretKey: ALERTMANAGER_PUSHOVER_TOKEN
      remoteRef:
        key: homelab-pushover/PUSHOVER_APP_KEY_ALERTMANAGER
    - secretKey: DISCORD_WEBHOOK_URL
      remoteRef:
        key: homelab-discord-alerts/WEBHOOK_URL
