# Longhorn Helm chart (see kubernetes/argo/apps/kube-system/longhorn.yaml).
# defaultReplicaCount + persistence.defaultClassReplicaCount must match so new PVCs
# and the StorageClass stay aligned (see Longhorn docs).
#
# Small 120 GiB PNY disks per node: default 30% "storage reserved" + 3 replicas
# makes the UI look full (high "allocated") while "usage" stays low (thin volumes).
# We lower reserved % and use 2 replicas + replica auto-balance to stretch capacity.
# Existing volumes keep their replica count until you change them in the Longhorn UI.

persistence:
  defaultClassReplicaCount: 2

preUpgradeChecker:
  # Required for Argo CD / GitOps (chart README).
  jobEnabled: false
  upgradeVersionCheck: false

httproute:
  enabled: true
  hostnames:
    - longhorn.veliz.cc
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https

# Scrape Longhorn manager metrics into kube-prometheus-stack (selectorNilUsesHelmValues: false).
metrics:
  serviceMonitor:
    enabled: true

# managerUrl must be reachable from inside the cluster (CSI driver, volume mounts).
# Public UI stays on https://longhorn.veliz.cc via httproute above.
defaultSettings:
  managerUrl: http://longhorn-backend.longhorn-system.svc.cluster.local:9500
  defaultReplicaCount: "2"
  # Default chart ~30% per disk is large on 120 GB SSDs; frees schedulable space for replicas.
  # Raise if rebuilds fail under load (see Longhorn docs).
  storageReservedPercentageForDefaultDisk: "15"
  replicaAutoBalance: best-effort
  # Back up detached volumes (idle PVCs) on the recurring schedule.
  allowRecurringJobWhileVolumeDetached: "true"

# S3 on in-cluster MinIO; object data lives on SuperUNAS NFS share Longhorn_Backups.
# UniFi Drive does not expose usable NFSv4, so Longhorn cannot use nfs:// directly.
# Credentials: Secret longhorn-backup-credentials (ExternalSecret → 1Password minio-secrets).
defaultBackupStore:
  # Region token is required in the URL; real endpoint is AWS_ENDPOINTS in the credential Secret.
  backupTarget: s3://longhorn@us-east-1/
  backupTargetCredentialSecret: longhorn-backup-credentials
  pollInterval: "300"

extraObjects:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: longhorn-system
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/warn: privileged
  # RecurringJobs (default group → all volumes without an explicit job label).
  - apiVersion: longhorn.io/v1beta2
    kind: RecurringJob
    metadata:
      name: daily-backup
      namespace: longhorn-system
    spec:
      # 07:00 UTC ≈ 03:00 America/New_York (EDT).
      cron: "0 7 * * *"
      task: backup
      groups:
        - default
      retain: 7
      concurrency: 2
      labels:
        schedule: daily
  - apiVersion: longhorn.io/v1beta2
    kind: RecurringJob
    metadata:
      name: snapshot-cleanup
      namespace: longhorn-system
    spec:
      # Weekly Sunday 08:00 UTC ≈ 04:00 ET.
      cron: "0 8 * * 0"
      task: snapshot-cleanup
      groups:
        - default
      # Longhorn requires retain=0 for snapshot-cleanup.
      retain: 0
      concurrency: 1
