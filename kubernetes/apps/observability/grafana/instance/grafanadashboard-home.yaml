# Veliz Home — SRE health board. https://grafana.veliz.cc/d/veliz-home
# Nodes first (CPU/mem/disk/load), then status with named failing services.
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: veliz-home
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folder: Home
