# 1Password item: grafana-mcp-secrets (Homelab vault)
#
# 1. Grafana → Administration → Service accounts → Add service account
#    Name: openclaw-mcp   Role: Viewer
# 2. Add token → copy value
# 3. Store as concealed field GRAFANA_SERVICE_ACCOUNT_TOKEN
#
# Optional: grant the SA datasource query permissions if Viewer is not enough
# for Prometheus/Loki Explore tools.
#
# ExternalSecret keys:
#   grafana-mcp-secrets/GRAFANA_SERVICE_ACCOUNT_TOKEN
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-mcp-secrets
  namespace: ai
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: grafana-mcp-secrets
    creationPolicy: Owner
  data:
    - secretKey: GRAFANA_SERVICE_ACCOUNT_TOKEN
      remoteRef:
        key: grafana-mcp-secrets/GRAFANA_SERVICE_ACCOUNT_TOKEN
