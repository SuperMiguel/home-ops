# Maps MinIO root keys into the Secret shape Longhorn expects for S3 backups.
# 1Password item: minio-secrets (same as the MinIO app).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: longhorn-backup-credentials
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: longhorn-backup-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        AWS_ACCESS_KEY_ID: "{{ .MINIO_ROOT_USER }}"
        AWS_SECRET_ACCESS_KEY: "{{ .MINIO_ROOT_PASSWORD }}"
        AWS_ENDPOINTS: "http://minio.minio.svc.cluster.local:9000"
        AWS_CERT: ""
  data:
    - secretKey: MINIO_ROOT_USER
      remoteRef:
        key: minio-secrets/MINIO_ROOT_USER
    - secretKey: MINIO_ROOT_PASSWORD
      remoteRef:
        key: minio-secrets/MINIO_ROOT_PASSWORD
