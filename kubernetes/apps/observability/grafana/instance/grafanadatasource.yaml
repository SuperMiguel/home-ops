---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: prometheus
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasource:
    type: prometheus
    name: Prometheus
    # Stable UID for dashboards (mutable). Avoids CR metadata UUIDs in panel JSON.
    uid: prometheus
    access: proxy
    isDefault: true
    url: http://kube-prometheus-stack-prometheus.observability.svc:9090
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: alertmanager
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasource:
    type: alertmanager
    name: Alertmanager
    uid: alertmanager
    access: proxy
    jsonData:
      implementation: prometheus
    url: http://kube-prometheus-stack-alertmanager.observability.svc:9093
---
# Fluent Bit → Victoria Logs; query from Grafana Explore with LogsQL (e.g. * or k_namespace_name:home).
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: victoria-logs
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  plugins:
    - name: victoriametrics-logs-datasource
      version: "0.31.0"
  datasource:
    type: victoriametrics-logs-datasource
    name: VictoriaLogs
    uid: victoria-logs
    access: proxy
    url: http://victoria-logs-server.observability.svc.cluster.local:9428
