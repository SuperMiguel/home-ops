# kube-prometheus-stack (Grafana disabled; use grafana-operator + Grafana CR).
# Chart: https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack
# Routes: Gateway API HTTPRoute (BETA) → envoy-internal (see network/envoy-gateway).
cleanPrometheusOperatorObjectNames: true

kubeProxy:
  enabled: false

kubeEtcd:
  enabled: false

alertmanager:
  enabled: true
  alertmanagerSpec:
    alertmanagerConfiguration:
      name: alertmanager
    externalUrl: https://alertmanager.veliz.cc
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
  route:
    main:
      enabled: true
      hostnames:
        - alertmanager.veliz.cc
      parentRefs:
        - name: envoy-internal
          namespace: network
          sectionName: https

prometheus:
  enabled: true
  prometheusSpec:
    externalUrl: https://prometheus.veliz.cc
    retention: 14d
    retentionSize: 8GB
    resources:
      requests:
        cpu: 100m
        memory: 1500Mi
      limits:
        memory: 3Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
  route:
    main:
      enabled: true
      hostnames:
        - prometheus.veliz.cc
      parentRefs:
        - name: envoy-internal
          namespace: network
          sectionName: https

grafana:
  enabled: false
  forceDeployDashboards: true
  operator:
    dashboardsConfigMapRefEnabled: true
    folder: observability
    matchLabels:
      dashboards: grafana

prometheus-node-exporter:
  fullnameOverride: node-exporter

kube-state-metrics:
  fullnameOverride: kube-state-metrics

additionalPrometheusRulesMap:
  oom-rules:
    groups:
      - name: oom
        rules:
          - alert: OomKilled
            annotations:
              summary: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
            expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
            labels:
              severity: critical
  homelab-rules:
    groups:
      - name: gatus
        rules:
          - alert: GatusMqttDown
            expr: gatus_results_endpoint_success{name="mqtt"} == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: MQTT (Mosquitto) Gatus check is failing
              description: >-
                Gatus TCP check home_mqtt has been down for 5m
                (tcp://mosquitto.home.svc.cluster.local:1883).
          - alert: GatusCriticalEndpointDown
            expr: >-
              gatus_results_endpoint_success{
                group=~"servers|lan-mgmt|trusted|home",
                name!="mqtt"
              } == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: Critical endpoint {{ $labels.name }} is down
              description: >-
                {{ $labels.name }} (group {{ $labels.group }}) has been failing for 5m
                — cluster, non-UniFi LAN (e.g. Ruckus), or home hubs.
          - alert: GatusCriticalIoTDown
            expr: gatus_results_endpoint_success{group="iot-critical"} == 0
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: Critical IoT endpoint {{ $labels.name }} is down
              description: >-
                {{ $labels.name }} (Wi‑Fi security/water/access device) has been
                failing for 15m — longer window to avoid flap noise.
          - alert: GatusImportantEndpointDown
            expr: >-
              gatus_results_endpoint_success{
                group=~"core|observability|storage|media|ai|iot-util"
              } == 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: Endpoint {{ $labels.name }} is down
              description: >-
                {{ $labels.name }} (group {{ $labels.group }}) has been failing for 15m.
          # iot-low / ai-low are probed for the status page only — no alert.
          # UniFi Network devices: see unpoller-rules (not Gatus ICMP).
      - name: kubernetes-pods
        rules:
          - alert: KubePodCrashLooping
            expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[5m]) >= 1
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} is CrashLoopBackOff
              description: >-
                Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }}
                has been CrashLoopBackOff for 15m.
          - alert: KubePodNotReady
            expr: >-
              kube_pod_status_ready{condition="false"} == 1
              unless on (namespace, pod)
              (kube_pod_owner{owner_kind="Job"} == 1)
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} is not ready
              description: >-
                Pod {{ $labels.namespace }}/{{ $labels.pod }} has reported Ready=false for 15m.
          - alert: HomeNamespacePodUnhealthy
            expr: >-
              kube_pod_status_phase{namespace="home", phase=~"Failed|Unknown"} == 1
              or
              kube_pod_container_status_waiting_reason{namespace="home", reason="CrashLoopBackOff"} == 1
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: Home namespace pod {{ $labels.pod }} is unhealthy
              description: >-
                Pod home/{{ $labels.pod }} has been Failed/Unknown/CrashLoopBackOff for 5m
                (MQTT, HA, Node-RED, Homebridge).
      - name: storage
        rules:
          - alert: PersistentVolumeUsageHigh
            expr: >-
              (
                kubelet_volume_stats_used_bytes
                / kubelet_volume_stats_capacity_bytes
              ) > 0.85
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is >85% full
              description: >-
                Volume {{ $labels.persistentvolumeclaim }} on {{ $labels.node }} is
                {{ $value | humanizePercentage }} full.
          - alert: PersistentVolumeUsageCritical
            expr: >-
              (
                kubelet_volume_stats_used_bytes
                / kubelet_volume_stats_capacity_bytes
              ) > 0.95
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is >95% full
              description: >-
                Volume {{ $labels.persistentvolumeclaim }} on {{ $labels.node }} is
                {{ $value | humanizePercentage }} full and needs space soon.
  # UniFi Network via Unpoller (https://github.com/unpoller/unpoller/tree/master/alerts).
  # Covers UDM/switches/APs/PDU so Gatus does not ICMP-duplicate them.
  unpoller-rules:
    groups:
      - name: unifi-health
        rules:
          - alert: UnifiPollerDown
            expr: up{job="unpoller"} == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: Unpoller is down or not scraping
              description: >-
                Prometheus cannot scrape Unpoller — UniFi device alerts will be blind.
          - alert: UnifiControllerDown
            expr: unpoller_controller_up == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: UniFi controller is unreachable
              description: >-
                Unpoller cannot reach the UniFi controller at {{ $labels.source }}.
          - alert: UnifiDeviceDisconnected
            expr: unpoller_site_disconnected{subsystem=~"wlan|wan|lan"} > 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: UniFi reports disconnected {{ $labels.subsystem }} device(s)
              description: >-
                {{ $value }} device(s) disconnected in {{ $labels.subsystem }}
                on {{ $labels.site_name }} (UniFi adoption state, not ICMP).
          - alert: UnifiDeviceInventoryDrop
            expr: count(unpoller_device_info) < 15
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: UniFi device inventory dropped below baseline (15)
              description: >-
                Unpoller currently sees {{ $value }} adopted devices (baseline 15).
                A switch/AP/PDU may have left the controller or stopped reporting.
      - name: unifi-wan
        rules:
          - alert: UnifiWANLowUptime
            expr: unpoller_wan_uptime_percentage < 95
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: WAN {{ $labels.wan_name }} uptime is low
              description: >-
                WAN {{ $labels.wan_name }} uptime at {{ $value }}%
                (site {{ $labels.site_name }}).
          - alert: UnifiWANDrops
            expr: increase(unpoller_site_intenet_drops_total[1h]) >= 2
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Multiple WAN drops on {{ $labels.site_name }}
              description: >-
                UniFi recorded {{ $value }} internet drop(s) in the last hour.
      - name: unifi-devices
        rules:
          - alert: UnifiDeviceHighCPU
            expr: unpoller_device_cpu_utilization_ratio > 0.9
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: High CPU on UniFi {{ $labels.name }}
              description: >-
                {{ $labels.type }} {{ $labels.name }} CPU at {{ $value | humanizePercentage }}.
          - alert: UnifiDeviceHighMemory
            expr: unpoller_device_memory_utilization_ratio > 0.9
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: High memory on UniFi {{ $labels.name }}
              description: >-
                {{ $labels.type }} {{ $labels.name }} memory at {{ $value | humanizePercentage }}.
      - name: unifi-dhcp
        rules:
          - alert: UnifiDHCPPoolHigh
            expr: unpoller_dhcp_utilization_percent > 90
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: DHCP pool nearly full on {{ $labels.network }}
              description: >-
                Network {{ $labels.network }} DHCP utilization at {{ $value }}%.
          - alert: UnifiDHCPPoolCritical
            expr: unpoller_dhcp_utilization_percent > 98
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: DHCP pool critically full on {{ $labels.network }}
              description: >-
                Network {{ $labels.network }} DHCP utilization at {{ $value }}%
                — new clients may fail to get an address.
      - name: unifi-cctv
        rules:
          # Protect cams + UNVR appear as UniFi clients on network=CCTV.
          # Cluster cannot ICMP VLAN 130 (firewall); Unpoller is the monitor path.
          - alert: UnifiCctvClientsMissing
            expr: count(unpoller_client_uptime_seconds{network="CCTV"}) < 11
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: CCTV client count dropped (Protect/UNVR)
              description: >-
                Unpoller sees {{ $value }} CCTV clients (baseline ~12: UNVR + cameras).
                One or more Protect devices may be offline or adopted elsewhere.
          - alert: UnifiUnvrOffline
            expr: absent(unpoller_client_uptime_seconds{network="CCTV", name="UNVR"})
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: UniFi UNVR is offline
              description: >-
                UNVR (Protect NVR) is not reporting as a CCTV client — camera
                recording/UI may be down.
