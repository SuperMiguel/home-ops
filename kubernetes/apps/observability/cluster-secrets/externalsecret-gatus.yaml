# Gatus → Pushover + Discord.
# 1Password:
#   homelab-pushover: PUSHOVER_USER_KEY, PUSHOVER_APP_KEY_GATUS
#   homelab-discord-alerts: WEBHOOK_URL
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gatus-secret
  namespace: observability
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: gatus-secret
    creationPolicy: Owner
  data:
    - secretKey: PUSHOVER_USER_KEY
      remoteRef:
        key: homelab-pushover/PUSHOVER_USER_KEY
    - secretKey: PUSHOVER_APP_KEY_GATUS
      remoteRef:
        key: homelab-pushover/PUSHOVER_APP_KEY_GATUS
    - secretKey: DISCORD_WEBHOOK_URL
      remoteRef:
        key: homelab-discord-alerts/WEBHOOK_URL
