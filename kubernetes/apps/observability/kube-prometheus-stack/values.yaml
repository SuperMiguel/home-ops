# kube-prometheus-stack (Grafana disabled; use grafana-operator + Grafana CR).
# Chart: https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack
# Routes: Gateway API HTTPRoute (BETA) → envoy-internal (see network/envoy-gateway).
cleanPrometheusOperatorObjectNames: true

kubeProxy:
  enabled: false

kubeEtcd:
  enabled: false

alertmanager:
  enabled: true
  alertmanagerSpec:
    alertmanagerConfiguration:
      name: alertmanager
    externalUrl: https://alertmanager.veliz.cc
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
  route:
    main:
      enabled: true
      hostnames:
        - alertmanager.veliz.cc
      parentRefs:
        - name: envoy-internal
          namespace: network
          sectionName: https

prometheus:
  enabled: true
  prometheusSpec:
    externalUrl: https://prometheus.veliz.cc
    retention: 14d
    retentionSize: 8GB
    resources:
      requests:
        cpu: 100m
        memory: 1500Mi
      limits:
        memory: 3Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
  route:
    main:
      enabled: true
      hostnames:
        - prometheus.veliz.cc
      parentRefs:
        - name: envoy-internal
          namespace: network
          sectionName: https

grafana:
  enabled: false
  forceDeployDashboards: true
  operator:
    dashboardsConfigMapRefEnabled: true
    folder: observability
    matchLabels:
      dashboards: grafana

prometheus-node-exporter:
  fullnameOverride: node-exporter

kube-state-metrics:
  fullnameOverride: kube-state-metrics

additionalPrometheusRulesMap:
  oom-rules:
    groups:
      - name: oom
        rules:
          - alert: OomKilled
            annotations:
              summary: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
            expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
            labels:
              severity: critical
  homelab-rules:
    groups:
      - name: gatus
        rules:
          - alert: GatusMqttDown
            expr: gatus_results_endpoint_success{name="mqtt"} == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: MQTT (Mosquitto) Gatus check is failing
              description: >-
                Gatus TCP check home_mqtt has been down for 5m
                (tcp://mosquitto.home.svc.cluster.local:1883).
          - alert: GatusCriticalEndpointDown
            expr: >-
              gatus_results_endpoint_success{
                group=~"servers|home",
                name!="mqtt"
              } == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: Critical endpoint {{ $labels.name }} is down
              description: >-
                {{ $labels.name }} (group {{ $labels.group }}) has been failing for 5m
                — hosts UniFi does not list (e.g. k8s-32/33) or home services.
          - alert: GatusImportantEndpointDown
            expr: >-
              gatus_results_endpoint_success{
                group=~"core|observability|storage|media|ai|iot-util"
              } == 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: Endpoint {{ $labels.name }} is down
              description: >-
                {{ $labels.name }} (group {{ $labels.group }}) has been failing for 15m.
          # ai-low: status only. UniFi-managed clients: unpoller-rules (MAC).
      - name: kubernetes-pods
        rules:
          - alert: KubePodCrashLooping
            expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[5m]) >= 1
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} is CrashLoopBackOff
              description: >-
                Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }}
                has been CrashLoopBackOff for 15m.
          - alert: KubePodNotReady
            expr: >-
              kube_pod_status_ready{condition="false"} == 1
              unless on (namespace, pod)
              (kube_pod_owner{owner_kind="Job"} == 1)
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} is not ready
              description: >-
                Pod {{ $labels.namespace }}/{{ $labels.pod }} has reported Ready=false for 15m.
          - alert: HomeNamespacePodUnhealthy
            expr: >-
              kube_pod_status_phase{namespace="home", phase=~"Failed|Unknown"} == 1
              or
              kube_pod_container_status_waiting_reason{namespace="home", reason="CrashLoopBackOff"} == 1
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: Home namespace pod {{ $labels.pod }} is unhealthy
              description: >-
                Pod home/{{ $labels.pod }} has been Failed/Unknown/CrashLoopBackOff for 5m
                (MQTT, HA, Node-RED, Homebridge).
      - name: storage
        rules:
          - alert: PersistentVolumeUsageHigh
            expr: >-
              (
                kubelet_volume_stats_used_bytes
                / kubelet_volume_stats_capacity_bytes
              ) > 0.85
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is >85% full
              description: >-
                Volume {{ $labels.persistentvolumeclaim }} on {{ $labels.node }} is
                {{ $value | humanizePercentage }} full.
          - alert: PersistentVolumeUsageCritical
            expr: >-
              (
                kubelet_volume_stats_used_bytes
                / kubelet_volume_stats_capacity_bytes
              ) > 0.95
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is >95% full
              description: >-
                Volume {{ $labels.persistentvolumeclaim }} on {{ $labels.node }} is
                {{ $value | humanizePercentage }} full and needs space soon.
  # UniFi Network via Unpoller (https://github.com/unpoller/unpoller/tree/master/alerts).
  # Covers UDM/switches/APs/PDU so Gatus does not ICMP-duplicate them.
  unpoller-rules:
    groups:
      - name: unifi-health
        rules:
          - alert: UnifiPollerDown
            expr: up{job="unpoller"} == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: Unpoller is down or not scraping
              description: >-
                Prometheus cannot scrape Unpoller — UniFi device alerts will be blind.
          - alert: UnifiControllerDown
            expr: unpoller_controller_up == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: UniFi controller is unreachable
              description: >-
                Unpoller cannot reach the UniFi controller at {{ $labels.source }}.
          - alert: UnifiDeviceDisconnected
            expr: unpoller_site_disconnected{subsystem=~"wlan|wan|lan"} > 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: UniFi reports disconnected {{ $labels.subsystem }} device(s)
              description: >-
                {{ $value }} device(s) disconnected in {{ $labels.subsystem }}
                on {{ $labels.site_name }} (UniFi adoption state, not ICMP).
          - alert: UnifiDeviceInventoryDrop
            expr: count(unpoller_device_info) < 15
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: UniFi device inventory dropped below baseline (15)
              description: >-
                Unpoller currently sees {{ $value }} adopted devices (baseline 15).
                A switch/AP/PDU may have left the controller or stopped reporting.
      - name: unifi-wan
        rules:
          - alert: UnifiWANLowUptime
            expr: unpoller_wan_uptime_percentage < 95
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: WAN {{ $labels.wan_name }} uptime is low
              description: >-
                WAN {{ $labels.wan_name }} uptime at {{ $value }}%
                (site {{ $labels.site_name }}).
          - alert: UnifiWANDrops
            expr: increase(unpoller_site_intenet_drops_total[1h]) >= 2
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Multiple WAN drops on {{ $labels.site_name }}
              description: >-
                UniFi recorded {{ $value }} internet drop(s) in the last hour.
      - name: unifi-devices
        rules:
          - alert: UnifiDeviceHighCPU
            expr: unpoller_device_cpu_utilization_ratio > 0.9
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: High CPU on UniFi {{ $labels.name }}
              description: >-
                {{ $labels.type }} {{ $labels.name }} CPU at {{ $value | humanizePercentage }}.
          - alert: UnifiDeviceHighMemory
            expr: unpoller_device_memory_utilization_ratio > 0.9
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: High memory on UniFi {{ $labels.name }}
              description: >-
                {{ $labels.type }} {{ $labels.name }} memory at {{ $value | humanizePercentage }}.
      - name: unifi-dhcp
        rules:
          - alert: UnifiDHCPPoolHigh
            expr: unpoller_dhcp_utilization_percent > 90
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: DHCP pool nearly full on {{ $labels.network }}
              description: >-
                Network {{ $labels.network }} DHCP utilization at {{ $value }}%.
          - alert: UnifiDHCPPoolCritical
            expr: unpoller_dhcp_utilization_percent > 98
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: DHCP pool critically full on {{ $labels.network }}
              description: >-
                Network {{ $labels.network }} DHCP utilization at {{ $value }}%
                — new clients may fail to get an address.
      - name: unifi-cctv
        rules:
          # Protect cams + UNVR appear as UniFi clients on network=CCTV.
          # Cluster cannot ICMP VLAN 130 (firewall); Unpoller is the monitor path.
          - alert: UnifiCctvClientsMissing
            expr: count(unpoller_client_uptime_seconds{network="CCTV"}) < 11
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: CCTV client count dropped (Protect/UNVR)
              description: >-
                Unpoller sees {{ $value }} CCTV clients (baseline ~12: UNVR + cameras).
                One or more Protect devices may be offline or adopted elsewhere.
          - alert: UnifiUnvrOffline
            expr: absent(unpoller_client_uptime_seconds{mac="58:d6:1f:64:4b:e9"})
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: UniFi UNVR is offline
              description: >-
                UNVR (MAC 58:d6:1f:64:4b:e9) is not reporting as a UniFi client —
                Protect recording/UI may be down.
      # Critical house clients by MAC (IP-agnostic). Update MAC when hardware is replaced.
      # See observability/SOURCE-OF-TRUTH.md
      - name: unifi-clients-critical
        rules:
          - alert: UnifiCriticalClientOffline
            expr: |-
              label_replace(absent(unpoller_client_uptime_seconds{mac="00:1c:2a:01:a1:e0"}), "client", "EnvisaLink", "", "")
              or label_replace(absent(unpoller_client_uptime_seconds{mac="34:e1:d1:81:ac:42"}), "client", "Hubitat-Downstairs", "", "")
              or label_replace(absent(unpoller_client_uptime_seconds{mac="34:e1:d1:81:1c:79"}), "client", "Hubitat-Upstairs", "", "")
              or label_replace(absent(unpoller_client_uptime_seconds{mac="8c:30:66:c4:8c:c5"}), "client", "SuperNAS", "", "")
              or label_replace(absent(unpoller_client_uptime_seconds{mac="d0:11:e5:af:e1:d6"}), "client", "super-macmini", "", "")
              or label_replace(absent(unpoller_client_uptime_seconds{mac="50:9a:4c:49:85:39"}), "client", "HL-PVE-30", "", "")
              or label_replace(absent(unpoller_client_uptime_seconds{mac="18:66:da:4b:f0:e8"}), "client", "HL-PVE-31", "", "")
              or label_replace(absent(unpoller_client_uptime_seconds{mac="50:9a:4c:42:aa:99"}), "client", "HL-PVE-34", "", "")
              or label_replace(absent(unpoller_client_uptime_seconds{mac="00:23:24:64:e7:6c"}), "client", "HL-PVE-35", "", "")
              or label_replace(absent(unpoller_client_uptime_seconds{mac="00:23:24:64:e0:c5"}), "client", "HL-PVE-36", "", "")
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "{{ $labels.client }} offline (UniFi MAC)"
              description: >-
                {{ $labels.client }} is missing from Unpoller client metrics.
                Tracked by MAC so DHCP/IP changes do not false-page.
          - alert: UnifiCriticalWifiClientOffline
            expr: |-
              label_replace(absent(unpoller_client_uptime_seconds{mac="ca:6a:10:23:7c:03"}), "client", "MyQ-Small-Garage", "", "")
              or label_replace(absent(unpoller_client_uptime_seconds{mac="ca:6a:10:21:e7:2a"}), "client", "MyQ-Large-Garage", "", "")
              or label_replace(absent(unpoller_client_uptime_seconds{mac="08:3a:88:2b:79:76"}), "client", "RingPro", "", "")
              or label_replace(absent(unpoller_client_uptime_seconds{mac="4c:24:98:09:c4:6a"}), "client", "flo-by-moen", "", "")
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "{{ $labels.client }} offline (UniFi MAC)"
              description: >-
                {{ $labels.client }} missing from Unpoller for 15m (Wi‑Fi flap window).
          - alert: UnifiRuckusApOffline
            expr: absent(unpoller_client_uptime_seconds{mac="34:20:e3:24:09:50"})
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: Large-Garage Ruckus AP offline
              description: >-
                Ruckus R510 (MAC 34:20:e3:24:09:50) not seen by UniFi — non-UniFi AP
                still appears as a MANAGEMENT client when up.
      - name: unifi-clients-warning
        rules:
          - alert: UnifiUtilClientOffline
            expr: |-
              label_replace(absent(unpoller_client_uptime_seconds{mac="44:61:32:87:e6:58"}), "client", "Ecobee-Downstairs", "", "")
              or label_replace(absent(unpoller_client_uptime_seconds{mac="44:61:32:34:23:10"}), "client", "Ecobee-Upstairs", "", "")
              or label_replace(absent(unpoller_client_uptime_seconds{mac="c0:5d:89:cf:2d:3c"}), "client", "Emporia-EV-Charger", "", "")
              or label_replace(absent(unpoller_client_uptime_seconds{mac="4c:11:ae:e6:9f:74"}), "client", "Emporia-Panel-1", "", "")
              or label_replace(absent(unpoller_client_uptime_seconds{mac="40:f5:20:70:07:04"}), "client", "Emporia-Panel-2", "", "")
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.client }} offline (UniFi MAC)"
              description: >-
                {{ $labels.client }} missing from Unpoller for 15m (climate/energy util).
