# 1Password item: minio-secrets (Homelab vault)
# Fields (concealed): MINIO_ROOT_USER, MINIO_ROOT_PASSWORD
# See SECRETS.md in the parent directory.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-secrets
  namespace: minio
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: minio-secrets
    creationPolicy: Owner
  data:
    - secretKey: MINIO_ROOT_USER
      remoteRef:
        key: minio-secrets/MINIO_ROOT_USER
    - secretKey: MINIO_ROOT_PASSWORD
      remoteRef:
        key: minio-secrets/MINIO_ROOT_PASSWORD
