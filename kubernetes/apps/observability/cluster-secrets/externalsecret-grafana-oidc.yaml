# OIDC client credentials for Grafana (Authentik application slug: grafana).
# 1Password item: grafana-oidc
#   CLIENT_ID     — from Authentik Provider (also in SECRETS.md / README)
#   CLIENT_SECRET — from Authentik Provider
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: grafana-oidc-secret
    creationPolicy: Owner
  data:
    - secretKey: CLIENT_ID
      remoteRef:
        key: grafana-oidc/CLIENT_ID
    - secretKey: CLIENT_SECRET
      remoteRef:
        key: grafana-oidc/CLIENT_SECRET
