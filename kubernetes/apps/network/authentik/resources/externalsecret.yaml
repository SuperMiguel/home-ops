# 1Password item: authentik-secrets (Homelab vault)
# See ../SECRETS.md
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secrets
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: authentik-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Consumed by Authentik server/worker via envFrom (chart existingSecret).
        AUTHENTIK_SECRET_KEY: "{{ .AUTHENTIK_SECRET_KEY }}"
        AUTHENTIK_BOOTSTRAP_PASSWORD: "{{ .AUTHENTIK_BOOTSTRAP_PASSWORD }}"
        AUTHENTIK_BOOTSTRAP_EMAIL: "{{ .AUTHENTIK_BOOTSTRAP_EMAIL }}"
        AUTHENTIK_POSTGRESQL__HOST: "authentik-postgresql"
        AUTHENTIK_POSTGRESQL__PORT: "5432"
        AUTHENTIK_POSTGRESQL__USER: "authentik"
        AUTHENTIK_POSTGRESQL__NAME: "authentik"
        AUTHENTIK_POSTGRESQL__PASSWORD: "{{ .POSTGRES_PASSWORD }}"
        # Bitnami/Postgres subchart auth.existingSecret keys.
        password: "{{ .POSTGRES_PASSWORD }}"
        postgres-password: "{{ .POSTGRES_PASSWORD }}"
  data:
    - secretKey: AUTHENTIK_SECRET_KEY
      remoteRef:
        key: authentik-secrets/AUTHENTIK_SECRET_KEY
    - secretKey: AUTHENTIK_BOOTSTRAP_PASSWORD
      remoteRef:
        key: authentik-secrets/AUTHENTIK_BOOTSTRAP_PASSWORD
    - secretKey: AUTHENTIK_BOOTSTRAP_EMAIL
      remoteRef:
        key: authentik-secrets/AUTHENTIK_BOOTSTRAP_EMAIL
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: authentik-secrets/POSTGRES_PASSWORD
