# 1Password item: openclaw-secrets (Homelab vault)
# Fields (concealed):
#   OPENCLAW_GATEWAY_TOKEN         — Control UI + Cursor MCP shared secret
#   DISCORD_BOT_TOKEN              — Discord Developer Portal bot token
#   OLLAMA_API_KEY                 — literal "ollama-local" for LAN Ollama
#   GRAFANA_SERVICE_ACCOUNT_TOKEN  — Grafana Viewer SA token (grafana-mcp)
#   HOME_ASSISTANT_TOKEN           — HA long-lived token (OpenClaw → /api/mcp)
#
# See SECRETS.md in this directory.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openclaw-secrets
  namespace: ai
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: openclaw-secrets
    creationPolicy: Owner
  data:
    - secretKey: OPENCLAW_GATEWAY_TOKEN
      remoteRef:
        key: openclaw-secrets/OPENCLAW_GATEWAY_TOKEN
    - secretKey: DISCORD_BOT_TOKEN
      remoteRef:
        key: openclaw-secrets/DISCORD_BOT_TOKEN
    - secretKey: OLLAMA_API_KEY
      remoteRef:
        key: openclaw-secrets/OLLAMA_API_KEY
    - secretKey: GRAFANA_SERVICE_ACCOUNT_TOKEN
      remoteRef:
        key: openclaw-secrets/GRAFANA_SERVICE_ACCOUNT_TOKEN
    - secretKey: HOME_ASSISTANT_TOKEN
      remoteRef:
        key: openclaw-secrets/HOME_ASSISTANT_TOKEN
